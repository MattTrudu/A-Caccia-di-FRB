<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FRB Search Simulator</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }
    canvas {
      border: 2px solid black;
      margin-top: 10px;
      image-rendering: pixelated;
    }
    button, input[type=range] {
      margin: 10px;
      padding: 8px 16px;
      font-size: 16px;
    }
    #plot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>FRB Search Simulator</h1>
  <p>Click on the waterfall plot to zap RFI. Use the DM and Time sliders to explore the data.</p>
  <div id="plot-container">
    <canvas id="lightcurve" width="500" height="100"></canvas>
    <canvas id="waterfall" width="500" height="300"></canvas>
  </div>
  <label for="dmSlider">Dispersion Measure (DM): <span id="dmValue">0</span></label><br>
  <input type="range" id="dmSlider" min="0" max="1000" value="0" step="10"><br>

  <label for="timeSlider">Start Time (s): <span id="timeValue">0.0</span></label><br>
  <input type="range" id="timeSlider" min="0" max="115" value="0" step="1"><br>

  <button onclick="generateFRB()">New FRB</button>
  <p id="feedback"></p>

  <script>
    const waterfallCanvas = document.getElementById("waterfall");
    const lightcurveCanvas = document.getElementById("lightcurve");
    const waterfallCtx = waterfallCanvas.getContext("2d");
    const lightcurveCtx = lightcurveCanvas.getContext("2d");
    const dmSlider = document.getElementById("dmSlider");
    const dmValueDisplay = document.getElementById("dmValue");
    const timeSlider = document.getElementById("timeSlider");
    const timeValueDisplay = document.getElementById("timeValue");
    const feedback = document.getElementById("feedback");

    let data = [], freqs = [], times = [], zapped = [], frbCenter = null;
    const nchan = 100, nbin = 1000;
    const fc = 600, bw = 400, duration = 120;
    const dt = duration / nbin;

    function gaussianRandom(mean = 0, stdDev = 1) {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * stdDev + mean;
    }

    function gauss(x, a, x0, sigma) {
      return a * Math.exp(-((x - x0) ** 2) / (2 * sigma ** 2));
    }

    function dispersionDelay(fstart, fstop, dm) {
      return 4148808.0 * dm * (1 / fstart ** 2 - 1 / fstop ** 2) / 1000;
    }

    function simulateFRB() {
      freqs = Array.from({ length: nchan }, (_, i) => fc + bw / 2 - i * (bw / nchan));
      times = Array.from({ length: nbin }, (_, i) => i * dt);

      const dm = Math.floor(Math.random() * 800 + 100);
      const tburst = Math.random() * 60 + 10;
      const fburst = freqs[Math.floor(Math.random() * freqs.length)];
      const width_t = Math.random() * 0.05 + 0.01;
      const width_f = Math.random() * 100 + 50;

      const sigma_t = width_t / 2.355;
      const sigma_f = width_f / 2.355;
      const If = freqs.map(f => gauss(f, 1, fburst, sigma_f));
      const A = Math.random() * 4 + 1;

      data = freqs.map((f, chan) => {
        const delay = dispersionDelay(f, freqs[0], dm);
        return times.map(t => A * If[chan] * gauss(t, 1, tburst + delay, sigma_t) + gaussianRandom(0, 0.1));
      });

      const rfiChannels = Array.from({ length: 5 }, () => Math.floor(Math.random() * nchan));
      rfiChannels.forEach(idx => data[idx] = times.map(() => A * 10));

      frbCenter = [Math.floor(freqs.length / 2), Math.floor((tburst / duration) * nbin)];
      zapped = [];
      timeSlider.value = 0;
      timeValueDisplay.textContent = "0.0";
    }

    function dedisperse(dm) {
      const refFreq = freqs[0];
      return data.map((row, i) => {
        const shift = Math.round(dispersionDelay(refFreq, freqs[i], dm) / dt);
        return row.map((_, j) => row[(j - shift + nbin) % nbin]);
      });
    }

    function drawWaterfall(matrix, tStart) {
      const segmentLength = 500;
      const startBin = Math.floor(tStart / dt);
      const submatrix = matrix.map(row => row.slice(startBin, startBin + segmentLength));

      const image = waterfallCtx.createImageData(segmentLength, nchan);
      const flat = submatrix.flat();
      const min = Math.min(...flat);
      const max = Math.max(...flat);

      for (let y = 0; y < nchan; y++) {
        for (let x = 0; x < segmentLength; x++) {
          const i = (y * segmentLength + x) * 4;
          let val = Math.floor(255 * (submatrix[y][x] - min) / (max - min));
          val = Math.min(255, Math.max(0, val));
          image.data[i] = val;
          image.data[i+1] = val;
          image.data[i+2] = val;
          image.data[i+3] = 255;
        }
      }
      waterfallCtx.putImageData(image, 0, 0);
    }

    function drawLightcurve(matrix, tStart) {
      const segmentLength = 500;
      const startBin = Math.floor(tStart / dt);
      const lightcurve = Array(segmentLength).fill(0);

      for (let x = 0; x < segmentLength; x++) {
        for (let y = 0; y < nchan; y++) {
          lightcurve[x] += matrix[y][startBin + x];
        }
        lightcurve[x] /= nchan;
      }

      lightcurveCtx.clearRect(0, 0, lightcurveCanvas.width, lightcurveCanvas.height);
      lightcurveCtx.beginPath();
      lightcurveCtx.moveTo(0, 100 - lightcurve[0] * 10);
      lightcurve.forEach((v, i) => {
        lightcurveCtx.lineTo(i * 500 / lightcurve.length, 100 - v * 10);
      });
      lightcurveCtx.stroke();
    }

    function render() {
      const dm = parseInt(dmSlider.value);
      const tStart = parseFloat(timeSlider.value);
      const dedisp = dedisperse(dm);
      drawWaterfall(dedisp, tStart);
      drawLightcurve(dedisp, tStart);
    }

    waterfallCanvas.addEventListener("click", (e) => {
      const rect = waterfallCanvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) * 500 / rect.width);
      const y = Math.floor((e.clientY - rect.top) * nchan / rect.height);
      zapped.push(y);
      data[y] = Array(nbin).fill(NaN);
      render();
    });

    dmSlider.addEventListener("input", () => {
      dmValueDisplay.textContent = dmSlider.value;
      render();
    });

    timeSlider.addEventListener("input", () => {
      timeValueDisplay.textContent = parseFloat(timeSlider.value).toFixed(1);
      render();
    });

    function generateFRB() {
      simulateFRB();
      render();
      feedback.textContent = "";
    }

    generateFRB();
  </script>
</body>
</html>
